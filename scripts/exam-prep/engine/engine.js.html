<script>
(function(){
  function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  var kps=[].slice.call(document.querySelectorAll('.kp'));
  document.getElementById('c-kp').textContent=kps.length;

  /* ---------- stacked-card labels ---------- */
  [].forEach.call(document.querySelectorAll('table.rt'),function(t){
    var heads=[].map.call(t.querySelectorAll('thead th'),function(th){return th.textContent});
    [].forEach.call(t.querySelectorAll('tbody tr'),function(tr){
      if(tr.classList.contains('grp'))return;
      var cells=tr.children, off=heads.length-cells.length;
      for(var i=0;i<cells.length;i++){cells[i].setAttribute('data-label',heads[i+off])}
    });
  });

  /* ---------- quiz data ---------- */
  var Q=[
  ];

  var F=[
  ];
  document.getElementById('c-q').textContent=Q.length;
  document.getElementById('c-f').textContent=F.length;

  var TNAMES={};
  function TN(w){return 'Topic '+w+(TNAMES[w]?' · '+TNAMES[w]:'')}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

  /* interleave: round-robin across weeks so no two neighbours share a week */
  function interleave(list,key,n){
    var g={};shuffle(list).forEach(function(x){var k=key(x);(g[k]=g[k]||[]).push(x)});
    var out=[],last=null,keys=Object.keys(g);
    while(out.length<(n||list.length)){
      var avail=shuffle(keys.filter(function(k){return g[k].length&&k!==last}));
      if(!avail.length)avail=keys.filter(function(k){return g[k].length});
      if(!avail.length)break;
      var k=avail[0];out.push(g[k].pop());last=k;
    }
    return out;
  }
  /* ---------- quiz ---------- */
  var qs=[],qi=0,correct=0,answered=false,card=document.getElementById('q-card');
  var okMsgs=["Correct.","Right.","That's it.","Nailed it."], badMsgs=["Not quite.","Close, but no.","Review this one."];
  function qStart(){
    var w=document.getElementById('q-week').value;
    qs=w==='mix'?interleave(Q,function(x){return x.w},15):shuffle(Q.filter(function(x){return w==='all'||String(x.w)===w}));
    qi=0;correct=0;qRender();
  }
  function qRender(){
    var sc=document.getElementById('q-score');
    if(qi>=qs.length){
      var pct=Math.round(100*correct/qs.length);
      card.innerHTML='<div class="result"><b>'+correct+' / '+qs.length+'</b><p>'+pct+'% correct</p><div class="qnav" style="justify-content:center"><button class="primary" type="button" id="q-again">Try again</button></div></div>';
      document.getElementById('q-again').onclick=qStart; sc.textContent='';return;
    }
    answered=false;
    var x=qs[qi];
    sc.textContent='Score '+correct+' / '+qi;
    var h='<div class="qmeta"><span>Question '+(qi+1)+' of '+qs.length+'</span><span>'+esc(TN(x.w))+'</span></div><div class="qtext">'+esc(x.q)+'</div><div class="opts">';
    x.o.forEach(function(o,i){h+='<button type="button" class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>'});
    h+='</div><div id="q-exp"></div><div class="qnav"><span></span><button type="button" class="primary" id="q-next" hidden>Next question →</button></div>';
    card.innerHTML=h;
    [].forEach.call(card.querySelectorAll('.opt'),function(b){b.onclick=function(){qAnswer(+b.getAttribute('data-i'))}});
    document.getElementById('q-next').onclick=function(){qi++;qRender();};
  }
  function qAnswer(i){
    if(answered)return; answered=true;
    var x=qs[qi],ok=i===x.a; if(ok)correct++;
    [].forEach.call(card.querySelectorAll('.opt'),function(b,j){b.disabled=true;if(j===x.a)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
    var m=ok?okMsgs[qi%okMsgs.length]:badMsgs[qi%badMsgs.length];
    document.getElementById('q-exp').innerHTML='<div class="explain"><b class="'+(ok?'v-ok':'v-bad')+'">'+m+'</b> '+esc(x.e)+'</div>';
    document.getElementById('q-score').textContent='Score '+correct+' / '+(qi+1);
    var n=document.getElementById('q-next'); n.hidden=false; n.focus();
  }
  document.getElementById('q-restart').onclick=qStart;
  document.getElementById('q-week').onchange=qStart;
  qStart();

  /* ---------- flashcards ---------- */
  var fs=[],fi=0,fc=document.getElementById('fc');
  function fStart(sh){
    var w=document.getElementById('f-week').value;
    if(w==='mix'){fs=interleave(F,function(x){return x[0]});fi=0;fRender();return}
    fs=F.filter(function(x){return w==='all'||String(x[0])===w});
    if(sh)fs=shuffle(fs); fi=0; fRender();
  }
  function fRender(){
    fc.classList.remove('flipped');
    var c=fs[fi];
    document.getElementById('f-lab').textContent=TN(c[0]);
    document.getElementById('f-front').textContent=c[1];
    document.getElementById('f-back').textContent=c[2];
    document.getElementById('f-pos').textContent='Card '+(fi+1)+' / '+fs.length;
  }
  function flip(){fc.classList.toggle('flipped')}
  fc.onclick=flip;
  fc.onkeydown=function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}else if(e.key==='ArrowRight'){fNext()}else if(e.key==='ArrowLeft'){fPrev()}};
  function fNext(){fi=(fi+1)%fs.length;fRender()}
  function fPrev(){fi=(fi-1+fs.length)%fs.length;fRender()}
  document.getElementById('f-next').onclick=fNext;
  document.getElementById('f-prev').onclick=fPrev;
  document.getElementById('f-shuffle').onclick=function(){fStart(true)};
  document.getElementById('f-week').onchange=function(){fStart(false)};
  fStart(false);

  /* ---------- study mode ---------- */
  var WEEKS=[
  ];
  function isLabQ(x){return false}
  function weekQs(id){return Q.filter(function(x){return id==='lab'?isLabQ(x):(String(x.w)===id&&!isLabQ(x))})}
  var weekEls=[].slice.call(document.querySelectorAll('#key .week'));
  weekEls.forEach(function(el,i){el.setAttribute('data-week',WEEKS[i]?WEEKS[i].id:'lab')});

  /* ratings (migrates old checkbox ticks to "Got it") */
  var RKEY='@@PFX@@-rate-v1', rates=load(RKEY,null);
  if(!rates){rates={};var old=load('@@PFX@@-kp-v1',{});Object.keys(old).forEach(function(k){if(old[k])rates[k]='got'});store(RKEY,rates)}
  var cpBest=load('@@PFX@@-cp-v1',{});
  var TKEY='@@PFX@@-rtime-v1',rtime=load(TKEY,{}),INT={miss:1,shaky:3,got:7},DAY=864e5;
  function isDue(k){var t=k.getAttribute('data-tag'),r=rates[t];if(!r)return false;var at=rtime[t];return !at||Date.now()>=at+INT[r]*DAY}
  function nextText(k){var t=k.getAttribute('data-tag'),r=rates[t];if(!r)return '';if(isDue(k))return 'Due for review now';var d=Math.ceil((rtime[t]+INT[r]*DAY-Date.now())/DAY);return 'Next review '+(d<=1?'tomorrow':'in '+d+' days')}
  var selfTest=!!load('@@PFX@@-self',false),weekBlur={}, weakOnly=false, curWeek=load('@@PFX@@-tab','1');
  if(!WEEKS.some(function(w){return w.id===curWeek})&&curWeek!=='all')curWeek='1';

  var RLAB={got:'Got it',shaky:'Shaky',miss:'Missed'};
  kps.forEach(function(k,i){
    var tag=(k.querySelector('.tag')||{}).textContent||('k'+i);
    k.setAttribute('data-tag',tag);
    var cb=k.querySelector('input[type=checkbox]');if(cb)cb.remove();
    var body=k.firstElementChild, ans=body.querySelector('.a');
    var rv=document.createElement('button');rv.type='button';rv.className='reveal';rv.textContent='Tap the answer to reveal';
    rv.innerHTML='Tap a bullet to reveal · tap again to re-blur · <u>reveal all</u>';
    rv.onclick=function(){units(ans).forEach(function(u){setBlur(u,false)});applyVis(k)};
    k._wk=function(){var w=k.closest('.week');return w?w.getAttribute('data-week'):''};
    ans.parentNode.insertBefore(rv,ans);
    wireUnits(ans,function(){applyVis(k)},function(){return !!weekBlur[k._wk()]});
    var rate=document.createElement('div');rate.className='rate';
    rate.innerHTML='<span class="rl">How did you do?</span>'+['got','shaky','miss'].map(function(r){return '<button type="button" class="b-'+r+'" data-r="'+r+'" aria-pressed="false">'+RLAB[r]+'</button>'}).join('');
    body.appendChild(rate);
    [].forEach.call(rate.querySelectorAll('button'),function(b){b.onclick=function(){
      var r=b.getAttribute('data-r');
      if(rates[tag]===r){delete rates[tag];delete rtime[tag]}else{rates[tag]=r;rtime[tag]=Date.now()}
      store(RKEY,rates);store(TKEY,rtime);paintRating(k);refresh();
    }});
    paintRating(k);
  });
  function paintRating(k){
    var r=rates[k.getAttribute('data-tag')];
    k.classList.remove('r-got','r-shaky','r-miss');if(r)k.classList.add('r-'+r);
    [].forEach.call(k.querySelectorAll('.rate button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-r')===r))});
    var rt=k.querySelector('.rate'),nr=rt&&rt.querySelector('.nr');if(rt&&!nr){nr=document.createElement('span');nr.className='nr';rt.appendChild(nr)}
    if(nr){nr.textContent=nextText(k);nr.classList.toggle('due',isDue(k))}
  }
  /* ---- per-bullet blur ---- */
  function units(c){
    if(c._units)return c._units;
    var list=[],buf=[];
    function flush(){
      if(!buf.length)return;
      var txt=buf.map(function(n){return n.textContent}).join('').trim();
      if(txt){var w=document.createElement('span');w.className='bu bu-text';c.insertBefore(w,buf[0]);buf.forEach(function(n){w.appendChild(n)});list.push(w)}
      buf=[];
    }
    [].slice.call(c.childNodes).forEach(function(n){
      if(n.nodeType===1&&/^(UL|OL)$/.test(n.tagName)){flush();[].forEach.call(n.children,function(li){li.classList.add('bu');list.push(li)})}
      else if(n.nodeType===1&&n.classList.contains('tbl-wrap')){flush();[].forEach.call(n.querySelectorAll('tbody tr'),function(tr){if(!tr.classList.contains('grp')){tr.classList.add('bu');list.push(tr)}})}
      else if(n.nodeType===1&&/^(P|DIV)$/.test(n.tagName)){flush();n.classList.add('bu');list.push(n)}
      else if(n.nodeType===1&&n.tagName==='BR'){flush();n.remove()}
      else buf.push(n);
    });
    flush();
    c._units=list;return list;
  }
  function setBlur(u,on,mode){
    u.classList.toggle('blurred',on);
    u.classList.toggle('reblur',!on&&!!mode);
    if(on){u.setAttribute('tabindex','0');u.setAttribute('aria-label','Hidden answer part, press to reveal')}
    else if(mode){u.setAttribute('tabindex','0');u.setAttribute('aria-label','Revealed answer part, press to blur again')}
    else{u.removeAttribute('tabindex');u.removeAttribute('aria-label')}
  }
  /* tap a blurred unit to reveal it; while blur mode is on, tap a revealed unit to blur it again */
  function wireUnits(c,after,modeFn){
    units(c);
    function act(e,u){var mode=modeFn?modeFn():false;
      if(u.classList.contains('blurred')){e.preventDefault();setBlur(u,false,mode);after();return}
      if(mode){e.preventDefault();setBlur(u,true,mode);after()}}
    c.addEventListener('click',function(e){if(e.target.closest('a,button,input,select,summary'))return;var u=e.target.closest('.bu');if(u&&c.contains(u))act(e,u)});
    c.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var u=e.target.closest('.bu');if(u&&c.contains(u)&&u===e.target)act(e,u)});
  }
  function applyVis(k){
    var mode=!!weekBlur[k._wk()],us=units(k.querySelector('.a')),blurredN=us.filter(function(u){return u.classList.contains('blurred')}).length;
    k.querySelector('.reveal').hidden=!mode;
    k.querySelector('.rate').hidden=mode&&blurredN===us.length;
  }

  /* week checkpoints */
  weekEls.forEach(function(el){
    var id=el.getAttribute('data-week'),w=WEEKS.filter(function(x){return x.id===id})[0],pool=weekQs(id);
    if(!pool.length)return;
    var idx=WEEKS.indexOf(w),next=WEEKS[idx+1];
    var cp=document.createElement('div');cp.className='checkpoint';
    cp.innerHTML='<h4>'+w.label+' checkpoint</h4><p class="cp-sub">'+Math.min(5,pool.length)+' quick questions from this section. <span class="cp-best"></span></p><div class="qcard"></div>'+
      '<div class="cp-actions"><button type="button" class="cp-new">New set</button><button type="button" class="cp-cards">Flip '+w.label+' flashcards</button>'+(next?'<button type="button" class="primary cp-next">Next: '+next.label+' →</button>':'<button type="button" class="primary cp-next">Review weak spots →</button>')+'</div>';
    el.appendChild(cp);
    var box=cp.querySelector('.qcard'),set=[],i=0,ok=0,done=false;
    function best(){var b=cpBest[id];cp.querySelector('.cp-best').textContent=b!=null?'Best: '+b+'/'+Math.min(5,pool.length)+'.':''}
    function start(){set=shuffle(pool).slice(0,5);i=0;ok=0;render()}
    function render(){
      if(i>=set.length){
        if(cpBest[id]==null||ok>cpBest[id]){cpBest[id]=ok;store('@@PFX@@-cp-v1',cpBest)}
        best();refresh();
        box.innerHTML='<div class="result"><b>'+ok+' / '+set.length+'</b><p>'+(ok===set.length?'Clean sweep. Move on when ready.':'Rate the key points above that tripped you up as Shaky or Missed.')+'</p></div>';return;
      }
      done=false;var x=set[i];
      var h='<div class="qmeta"><span>Question '+(i+1)+' of '+set.length+'</span><span>'+ok+' correct</span></div><div class="qtext">'+esc(x.q)+'</div><div class="opts">';
      x.o.forEach(function(o,j){h+='<button type="button" class="opt" data-i="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>'});
      h+='</div><div class="cp-exp"></div><div class="qnav"><span></span><button type="button" class="primary cp-go" hidden>Next →</button></div>';
      box.innerHTML=h;
      [].forEach.call(box.querySelectorAll('.opt'),function(b){b.onclick=function(){
        if(done)return;done=true;var j=+b.getAttribute('data-i'),good=j===x.a;if(good)ok++;
        [].forEach.call(box.querySelectorAll('.opt'),function(o,n){o.disabled=true;if(n===x.a)o.classList.add('right');else if(n===j)o.classList.add('wrong')});
        box.querySelector('.cp-exp').innerHTML='<div class="explain"><b class="'+(good?'v-ok':'v-bad')+'">'+(good?'Correct.':'Not quite.')+'</b> '+esc(x.e)+'</div>';
        var g=box.querySelector('.cp-go');g.hidden=false;g.textContent=i+1<set.length?'Next →':'See score';g.onclick=function(){i++;render()};
      }});
    }
    cp.querySelector('.cp-new').onclick=start;
    cp.querySelector('.cp-cards').onclick=function(){var s=document.getElementById('f-week');s.value=(id==='lab'?'4':id);fStart(false);document.getElementById('cards').scrollIntoView({behavior:'smooth'})};
    cp.querySelector('.cp-next').onclick=function(){
      if(next)setWeek(next.id);else{weakOnly=true;document.getElementById('st-weak').checked=true;setWeek('all')}
      document.getElementById('study-ctl').scrollIntoView({behavior:'smooth'});
    };
    best();start();
  });

  /* tabs, filters, tally */
  var tabsEl=document.getElementById('wk-tabs');
  function tabHTML(id,label){return '<button type="button" class="tab" role="tab" data-w="'+id+'" aria-selected="false"><span class="tl">'+label+'</span><span class="tp"></span><span class="tm"><i></i></span></button>'}
  tabsEl.innerHTML=tabHTML('due','Due today')+tabHTML('all','All')+WEEKS.map(function(w){return tabHTML(w.id,w.label)}).join('');
  [].forEach.call(tabsEl.querySelectorAll('.tab'),function(t){t.onclick=function(){setWeek(t.getAttribute('data-w'))}});
  function setWeek(id){curWeek=id;store('@@PFX@@-tab',id);refresh()}
  function kpsOf(id){return kps.filter(function(k){if(id==='due')return isDue(k);var w=k.closest('.week');return id==='all'||(w&&w.getAttribute('data-week')===id)})}
  function refresh(){
    [].forEach.call(tabsEl.querySelectorAll('.tab'),function(t){
      var id=t.getAttribute('data-w'),list=kpsOf(id),got=list.filter(function(k){return rates[k.getAttribute('data-tag')]==='got'}).length;
      t.setAttribute('aria-selected',String(id===curWeek));
      if(id==='due'){t.querySelector('.tp').textContent=list.length+' due';t.querySelector('.tm i').style.width=list.length?'100%':'0';t.classList.toggle('has-due',list.length>0);return}
      t.querySelector('.tp').textContent=got+'/'+list.length+(cpBest[id]!=null?' · quiz '+cpBest[id]:'');
      t.querySelector('.tm i').style.width=(list.length?100*got/list.length:0)+'%';
    });
    var anyShown=false;
    weekEls.forEach(function(el){
      var due=curWeek==='due',inWeek=due||curWeek==='all'||el.getAttribute('data-week')===curWeek,vis=0;
      [].forEach.call(el.querySelectorAll('.kp'),function(k){
        var r=rates[k.getAttribute('data-tag')],show=inWeek&&(!due||isDue(k))&&(!weakOnly||r==='shaky'||r==='miss');
        k.hidden=!show;if(show)vis++;applyVis(k);paintRating(k);
      });
      el.hidden=!inWeek||((weakOnly||due)&&vis===0);
      var cp=el.querySelector('.checkpoint');if(cp)cp.hidden=weakOnly||due;
      if(!el.hidden)anyShown=true;
    });
    var em=document.getElementById('st-empty');em.hidden=anyShown;
    em.textContent=curWeek==='due'?'Nothing is due right now. Rate key points as you study (Missed returns tomorrow, Shaky in 3 days, Got it in 7 days) and they\u2019ll show up here when it\u2019s time to review them.':'Nothing to show: no items in this view are rated Shaky or Missed. Turn off Weak spots to see everything.';
    var list=kpsOf(curWeek),c={got:0,shaky:0,miss:0};
    list.forEach(function(k){var r=rates[k.getAttribute('data-tag')];if(r)c[r]++});
    var un=list.length-c.got-c.shaky-c.miss,scope=curWeek==='due'?'Due for review':curWeek==='all'?'All topics':WEEKS.filter(function(w){return w.id===curWeek})[0].label+' · '+WEEKS.filter(function(w){return w.id===curWeek})[0].name;
    document.getElementById('st-tally').innerHTML='<span>'+esc(scope)+'</span><span class="t-got">Got it <b>'+c.got+'</b></span><span class="t-shaky">Shaky <b>'+c.shaky+'</b></span><span class="t-miss">Missed <b>'+c.miss+'</b></span><span>Not rated <b>'+un+'</b></span>';
    ['got','shaky','miss'].forEach(function(r){document.getElementById('bar-'+r).style.width=(list.length?100*c[r]/list.length:0)+'%'});
    document.getElementById('kp-count').textContent=kps.filter(function(k){return rates[k.getAttribute('data-tag')]==='got'}).length+' / '+kps.length+' got it';
  }
  var selfEl=document.getElementById('st-self'),weakEl=document.getElementById('st-weak');
  selfEl.checked=selfTest;
  /* per-week (section) blur */
  function setWeekBlur(w,on){
    weekBlur[w]=on;
    kps.forEach(function(k){if(k._wk()===w)units(k.querySelector('.a')).forEach(function(u){setBlur(u,on,on)})});
    var btn=document.querySelector('.week[data-week="'+w+'"] .sec-blur');if(btn){btn.textContent=on?'Unblur this topic':'Blur this topic';btn.setAttribute('aria-pressed',String(on))}
  }
  function syncSelf(){var all=WEEKS.every(function(w){return weekBlur[w.id]});selfEl.checked=all;selfTest=all;store('@@PFX@@-self',all)}
  weekEls.forEach(function(el){
    var h=el.querySelector('h3'),w=el.getAttribute('data-week');if(!h)return;
    var wrap=document.createElement('div');wrap.className='wk-head';h.parentNode.insertBefore(wrap,h);wrap.appendChild(h);
    var btn=document.createElement('button');btn.type='button';btn.className='sec-blur';wrap.appendChild(btn);
    btn.onclick=function(){setWeekBlur(w,!weekBlur[w]);syncSelf();refresh()};
  });
  WEEKS.forEach(function(w){setWeekBlur(w.id,selfTest)});
  selfEl.onchange=function(){WEEKS.forEach(function(w){setWeekBlur(w.id,selfEl.checked)});syncSelf();refresh()};
  weakEl.onchange=function(){weakOnly=weakEl.checked;refresh()};
  var rs=document.getElementById('st-reset'),armT;
  rs.onclick=function(){
    if(!rs.classList.contains('armed')){rs.classList.add('armed');rs.textContent='Tap again to clear all ratings';armT=setTimeout(function(){rs.classList.remove('armed');rs.textContent='Reset ratings'},4000);return}
    clearTimeout(armT);rates={};rtime={};cpBest={};store(RKEY,rates);store(TKEY,rtime);store('@@PFX@@-cp-v1',cpBest);
    rs.classList.remove('armed');rs.textContent='Ratings cleared';setTimeout(function(){rs.textContent='Reset ratings'},2000);
    kps.forEach(paintRating);weekEls.forEach(function(el){var b=el.querySelector('.cp-best');if(b)b.textContent=''});refresh();
  };
  var SECS=[['cases','.ca li','Hides the model answers',true],['theories','tbody tr:not(.grp) td:not(.name)','Hides everything except the theory names'],['confused','tbody td:not(.name)','Hides both definitions and the tell'],['connects','.threads li span','Hides each thread, leaving its title'],['numbers','.nums b','Hides the values, leaving the labels']];
  SECS.forEach(function(cfg){
    var sec=document.getElementById(cfg[0]);if(!sec)return;var mode=!!cfg[3];
    var list=[].slice.call(sec.querySelectorAll(cfg[1]));list.forEach(function(u){u.classList.add('bu')});sec._units=list;
    var btn=document.createElement('button');btn.type='button';btn.className='sec-blur';btn.title=cfg[2];
    var head=sec.querySelector('.sec-head');head.insertBefore(btn,head.querySelector('.meta'));
    function sync(){btn.textContent=mode?'Unblur section':'Blur section';btn.setAttribute('aria-pressed',String(mode))}
    btn.onclick=function(){mode=!mode;list.forEach(function(u){setBlur(u,mode,mode)});sync()};
    wireUnits(sec,function(){},function(){return mode});if(mode)list.forEach(function(u){setBlur(u,true,true)});sync();
  });
  var cw=document.getElementById('case-week');
  if(cw)cw.onchange=function(){[].forEach.call(document.querySelectorAll('.case'),function(c){c.hidden=!(cw.value==='all'||c.getAttribute('data-weeks').split(' ').indexOf(cw.value)>=0)})};
  var rqt=document.getElementById('rq-toggle'),rqa=[].slice.call(document.querySelectorAll('.rqa'));
  function rqUnits(){var all=[];rqa.forEach(function(el){all=all.concat(units(el))});return all}
  var rqMode=true;
  function syncRq(){rqt.textContent=rqMode?'Unblur section':'Blur section';rqt.setAttribute('aria-pressed',String(rqMode))}
  rqa.forEach(function(el){wireUnits(el,function(){},function(){return rqMode});units(el).forEach(function(u){setBlur(u,true,true)})});

    var date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    return {title:title,html:'<h1>'+esc(title)+'<\/h1><div class="sh-by">'+esc(GUIDE)+' · '+esc(BY)+' · printed '+esc(date)+'<\/div>'+root.innerHTML+refsFor(root)};
  }
  var sv=document.createElement('div');sv.id='sheet-view';sv.hidden=true;sv.setAttribute('role','dialog');sv.setAttribute('aria-modal','true');sv.setAttribute('aria-label','Printable sheet');
  sv.innerHTML='<div class="sheet-bar"><span class="sb-t" id="sheet-t"><\/span><button type="button" class="primary" id="sheet-print">Print<\/button><button type="button" id="sheet-dl">Download<\/button><button type="button" id="sheet-close">Close<\/button><\/div><p class="sheet-note">If Print does nothing here, use Download and print the file from your browser.<\/p><div class="sheet" id="sheet-body"><\/div>';
  document.body.appendChild(sv);
  var curSheet=null,lastFocus=null;
  function openSheet(id){var s=sheetHTML(id);if(!s)return;curSheet=s;lastFocus=document.activeElement;
    document.getElementById('sheet-t').textContent=s.title;document.getElementById('sheet-body').innerHTML=s.html;
    sv.hidden=false;document.body.classList.add('sheet-open');sv.scrollTop=0;document.getElementById('sheet-close').focus()}
  function closeSheet(){sv.hidden=true;document.body.classList.remove('sheet-open');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
  document.getElementById('sheet-close').onclick=closeSheet;
  sv.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
  document.getElementById('sheet-print').onclick=function(){try{window.print()}catch(e){toast('Printing is blocked here. Use Download instead.')}};
  document.getElementById('sheet-dl').onclick=async function(){
    if(!curSheet)return;
    var doc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(curSheet.title)+'<\/title><style>'+"*{box-sizing:border-box}body{margin:0;background:#fff}\n.sheet-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.sheet-pick select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}\n.sheet-bar{position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}\n.sheet-bar .sb-t{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-right:auto;min-width:0}\n.sheet-note{font-size:12.5px;color:var(--ink-2);padding:6px 16px 0;max-width:8.5in;margin:0 auto}\n.sheet{background:#fff;color:#141414;max-width:8.5in;margin:16px auto 40px;padding:.45in .5in;box-shadow:0 2px 14px rgba(0,0,0,.12);font:9.2pt/1.32 \"IBM Plex Sans\",system-ui,sans-serif}\n@media (max-width:640px){.sheet{padding:18px 16px;margin:10px 8px 30px;font-size:10pt}}\n.sheet h1{font:600 14pt/1.2 \"Literata\",Georgia,serif;margin:0}\n.sheet .sh-by{font:8pt \"IBM Plex Mono\",monospace;color:#555;margin:2px 0 8px;border-bottom:1px solid #ccc;padding-bottom:5px}\n.sheet .sh-cols{column-count:2;column-gap:.28in}\n@media (max-width:640px){.sheet .sh-cols{column-count:1}}\n.sheet .sh-kp{margin:0 0 7px}\n.sheet .sh-q{break-after:avoid}\n.sheet li,.sheet tr{break-inside:avoid}\n.sheet .sh-q{font-weight:600;margin-bottom:1px}\n.sheet .sh-q .t{font:500 7.5pt \"IBM Plex Mono\",monospace;color:#2d48b0;margin-right:4px}\n.sheet ul,.sheet ol{margin:1px 0 2px;padding-left:13px}\n.sheet li{margin:0}\n.sheet p{margin:0 0 2px}\n.sheet .src{font:7pt \"IBM Plex Mono\",monospace;color:#555;background:none;padding:0}\n.sheet .src a{color:inherit;text-decoration:none}\n.sheet .mine{font:7pt \"IBM Plex Mono\",monospace;border:1px dashed #999;border-radius:3px;padding:0 3px}\n.sheet .gaptag{font:7pt \"IBM Plex Mono\",monospace;color:#8a5a00}\n.sheet table{border-collapse:collapse;width:100%;font-size:8pt;margin:2px 0 4px}\n.sheet th,.sheet td{border:1px solid #bbb;padding:2px 4px;text-align:left;vertical-align:top}\n.sheet th{background:#eee}\n.sheet td.name{font-weight:600}\n.sheet td.name small{display:block;font-weight:400;font-size:7pt}\n.sheet tr.grp td{background:#eef0f8;font-weight:600;font-size:7.5pt;text-transform:uppercase;letter-spacing:.04em}\n.sheet td ul{padding-left:11px}\n.sheet td[data-label]::before{content:none}\n.sheet .tbl-wrap{overflow:visible}\n.sheet .sh-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px}\n.sheet .sh-nums div{break-inside:avoid;border-bottom:1px solid #e3e3e3;padding-bottom:3px}\n.sheet .sh-nums b{display:block;font:600 10pt \"IBM Plex Mono\",monospace;color:#2d48b0}\n.sheet .sh-refs{margin-top:8px;border-top:1px solid #ccc;padding-top:4px;font-size:7pt;line-height:1.3;color:#333}\n.sheet .sh-refs ol{padding-left:0;list-style:none}\n.sheet .sh-refs li{margin-bottom:1px}\n.sheet .sh-refs a{color:inherit}\n@media print{.sheet{box-shadow:none;margin:0;padding:0;max-width:none}@page{margin:.4in}}\n"+'<\/style><\/head><body><div class="sheet">'+curSheet.html+'<\/div><\/body><\/html>';
    var name=(curSheet.title.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'sheet')+'.html';
    var dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
    if(dl){try{await dl.save({filename:name,data:doc});return}catch(e){if(e&&e.code==='declined')return}}
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){toast('Download isn’t available here.')}
  };
  (function(){
    var sel=document.getElementById('sheet-sel');
    if(sel){sel.innerHTML=WEEKS.filter(function(w){return document.querySelector('#key .week[data-week="'+w.id+'"] .kp')}).map(function(w){return '<option value="'+w.id+'">'+esc(w.label+' · '+w.name)+'<\/option>'}).join('')+(document.getElementById('numbers')?'<option value="numbers">Numbers to know<\/option>':'');
      document.getElementById('sheet-open').onclick=function(){openSheet(sel.value)}}
    weekEls.forEach(function(el){var hd=el.querySelector('.wk-head'),id=el.getAttribute('data-week');if(!hd||!el.querySelector('.kp'))return;
      var b=document.createElement('button');b.type='button';b.className='sec-blur';b.textContent='Print sheet';b.onclick=function(){openSheet(id)};hd.appendChild(b)});
    var nh=document.querySelector('#numbers .sec-head');if(nh){var b=document.createElement('button');b.type='button';b.className='sec-blur';b.textContent='Print sheet';b.onclick=function(){openSheet('numbers')};nh.insertBefore(b,nh.querySelector('.meta'))}
  })();

  /* ---- sync to the viewer's account (db capability) ---- */
  var SKEY=PFX+'-sync-ts',EXTRA=[ARC_BEST];
  function syncKeys(){var ks=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k!==SKEY&&(k.indexOf(PFX+'-')===0||EXTRA.indexOf(k)>=0))ks.push(k)}}catch(e){}return ks}
  var syncState={mode:'local',at:0,msg:''},pushT=null,dbRef=null;
  function setSync(mode,msg){syncState.mode=mode;syncState.msg=msg||'';var el=document.getElementById('sync-line');if(!el)return;
    el.className='sync-line'+(mode==='on'?' on':mode==='busy'?' busy':mode==='err'?' err':'');
    el.querySelector('.sync-t').textContent=mode==='on'?'Synced to your Claude account'+(syncState.at?' · '+new Date(syncState.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''):mode==='busy'?'Syncing…':mode==='err'?'Couldn’t sync; progress is still saved in this browser':(msg||'Progress is saved in this browser only')}
  var _store=store;
  store=function(k,v){_store(k,v);if(k!==PFX+'-tab'){try{localStorage.setItem(SKEY,String(Date.now()))}catch(e){}schedPush()}};
  function schedPush(){if(!dbRef)return;clearTimeout(pushT);pushT=setTimeout(push,2500)}
  async function push(){
    if(!dbRef)return;clearTimeout(pushT);pushT=null;
    var keys={};syncKeys().forEach(function(k){try{keys[k]=localStorage.getItem(k)}catch(e){}});
    var ts=0;try{ts=+localStorage.getItem(SKEY)||Date.now()}catch(e){ts=Date.now()}
    setSync('busy');
    try{await dbRef.set({v:1,ts:ts,keys:keys});syncState.at=Date.now();setSync('on')}
    catch(e){if(e&&e.code==='invalid_argument'){dbRef=null;setSync('local','Progress is saved in this browser only (your access level can’t sync)')}else setSync('err')}
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&pushT)push()});
  (async function(){
    setSync('local');
    try{var n=localStorage.getItem(PFX+'-sync-note');if(n){localStorage.removeItem(PFX+'-sync-note');toast(n==='r'?'Progress restored from your backup.':'Loaded your latest progress from your account.')}}catch(e){}
    if(!window.claude||!claude.use)return;
    var db=null,user=null;try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
    if(!db||!user)return;
    var uid=null;try{uid=await user.id()}catch(e){}
    if(!uid){setSync('local','Progress is saved in this browser only (sign in to sync)');return}
    try{dbRef=db.doc('data/users/'+uid+'/progress')}catch(e){return}
    setSync('busy');
    var snap;try{snap=await dbRef.get()}catch(e){setSync('err');return}
    var localTs=0;try{localTs=+localStorage.getItem(SKEY)||0}catch(e){}
    var r=snap.exists?snap.data():null;
    if(r&&r.keys&&+r.ts>localTs){
      try{syncKeys().forEach(function(k){if(!(k in r.keys))localStorage.removeItem(k)});
        Object.keys(r.keys).forEach(function(k){if(typeof r.keys[k]==='string')localStorage.setItem(k,r.keys[k])});
        localStorage.setItem(SKEY,String(r.ts));localStorage.setItem(PFX+'-sync-note','1')}catch(e){setSync('err');return}
      location.reload();return;
    }
    if(!r||localTs>+r.ts)push();else{syncState.at=Date.now();setSync('on')}
  })();
  /* ---- backup / restore (moves progress between devices) ---- */
  function bkMsg(t){var m=document.getElementById('bk-msg');if(m)m.textContent=t}
  document.getElementById('bk-save').onclick=async function(){
    var keys={};syncKeys().forEach(function(k){try{keys[k]=localStorage.getItem(k)}catch(e){}});
    var data=JSON.stringify({guide:GUIDE,pfx:PFX,saved:new Date().toISOString(),keys:keys});
    var name=GUIDE.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
    var dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
    if(dl){try{await dl.save({filename:name,data:data});bkMsg('Backup saved.');return}catch(e){if(e&&e.code==='declined'){bkMsg('');return}}}
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);bkMsg('Backup saved.')}catch(e){bkMsg('Saving isn\u2019t available here.')}
  };
  document.getElementById('bk-file').onchange=function(){
    var f=this.files&&this.files[0];this.value='';if(!f)return;
    var rd=new FileReader();rd.onload=function(){
      var d;try{d=JSON.parse(rd.result)}catch(e){bkMsg('That file isn\u2019t a progress backup.');return}
      if(!d||d.pfx!==PFX||!d.keys){bkMsg(d&&d.guide?'That backup is for '+d.guide+', not this guide.':'That file isn\u2019t a progress backup for this guide.');return}
      try{syncKeys().forEach(function(k){if(!(k in d.keys))localStorage.removeItem(k)});Object.keys(d.keys).forEach(function(k){if(typeof d.keys[k]==='string'&&(k.indexOf(PFX+'-')===0||EXTRA.indexOf(k)>=0))localStorage.setItem(k,d.keys[k])});localStorage.setItem(SKEY,String(Date.now()));localStorage.setItem(PFX+'-sync-note','r')}catch(e){bkMsg('Couldn\u2019t restore in this browser.');return}
      location.reload();
    };rd.readAsText(f);
  };
  renderWeak();
})();
</script>

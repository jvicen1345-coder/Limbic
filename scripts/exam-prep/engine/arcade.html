<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}a.home{font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;font-size:13px;text-decoration:none;border-radius:999px;padding:6px 14px;display:inline-block}</style>
<title>@@ARCADE_NAME@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#141024; --panel:#1e1834; --panel-2:#272043; --line:#382f5a; --ink:#f2eeff; --muted:#a89fc8;
  --amber:#ffb547; --amber-ink:#1c1300; --teal:#43d1bf; --teal-bg:#123a3a; --coral:#ff7a6b; --coral-bg:#43192a;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}
/* header */
header.top{padding-block:28px 8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{font-size:clamp(40px,9vw,72px);font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--amber)}
.trace{width:100%;height:56px;display:block;margin-top:6px}
.trace path{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:fire 1.6s ease-out .2s forwards}
.trace .base{stroke:var(--line);stroke-dasharray:none;animation:none;stroke-width:1.5}
@keyframes fire{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.trace path{animation:none;stroke-dashoffset:0}}
.sub{color:var(--muted);max-width:58ch;margin-top:4px}
/* hub */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--amber)}
.tile .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.tile h3{font-size:24px;font-weight:800}
.tile p{color:var(--muted);font-size:14.5px}
.tile .best{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--teal)}
.tile.wide{grid-column:1/-1}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
/* game shell */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:22px 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.back:hover{color:var(--ink);border-color:var(--muted)}
.bar h2{font-size:28px;font-weight:800;margin-right:auto}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.pill b{color:var(--amber);font-weight:700}
.howto{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
/* match */
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px;line-height:1.35;min-height:52px}
.card.term{font-weight:700}
.card.sel{border-color:var(--amber);background:var(--panel-2)}
.card.done{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);cursor:default}
.card.bad{border-color:var(--coral);background:var(--coral-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.card.bad,.seqchip.bad{animation:none}}
@media (max-width:520px){.cols{grid-template-columns:1fr 1.25fr}.card{font-size:14px;padding:10px}}
/* prompt card */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stage .big{font-family:var(--display);font-size:clamp(20px,4vw,27px);font-weight:600;line-height:1.3}
.buckets{display:grid;gap:10px;margin-top:14px}
.b2{grid-template-columns:repeat(2,1fr)}
.b4{grid-template-columns:repeat(2,1fr)}
.b3{grid-template-columns:repeat(3,1fr)}
@media (max-width:480px){.b3{grid-template-columns:1fr}}
.bucket{background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:16px 10px;font-weight:700;font-size:16px}
.bucket:hover{border-color:var(--amber)}
.bucket.right{border-color:var(--teal);background:var(--teal-bg);color:var(--teal)}
.bucket.wrong{border-color:var(--coral);background:var(--coral-bg);color:var(--coral)}
.feedback{min-height:48px;margin-top:12px;font-size:15px;text-align:center;color:var(--muted)}
.feedback .ok{color:var(--teal);font-weight:700}
.feedback .no{color:var(--coral);font-weight:700}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tf button{border-radius:12px;padding:18px;font-family:var(--display);font-size:22px;font-weight:800;border:1.5px solid var(--line);background:var(--panel-2)}
.tf .t:hover{border-color:var(--teal);color:var(--teal)}
.tf .f:hover{border-color:var(--coral);color:var(--coral)}
.timer{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--amber);width:100%;transition:width 1s linear}
/* order */
.slots{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:10px 14px;min-height:46px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.slot.filled{border-style:solid;border-color:var(--teal);background:var(--teal-bg);color:var(--ink)}
.slot .n{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:18px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.seqchip{background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;text-align:left}
.seqchip:hover{border-color:var(--amber)}
.seqchip.bad{border-color:var(--coral);background:var(--coral-bg);animation:shake .3s}
/* blanks */
.blank-line{font-family:var(--display);font-size:clamp(19px,3.8vw,25px);font-weight:600;line-height:1.4}
.blank-line .gap{display:inline-block;min-width:5ch;border-bottom:3px solid var(--amber);color:var(--amber);padding-inline:4px}
/* results */
.result{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .score{font-family:var(--display);font-size:64px;font-weight:800;color:var(--amber);line-height:1}
.result .best{font-family:var(--mono);font-size:13px;color:var(--teal)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{border-radius:999px;padding:11px 20px;font-weight:700;border:1.5px solid var(--line);background:var(--panel-2)}
.btn.go{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.missed{text-align:left;width:100%;max-width:560px;margin-top:10px}
.missed h4{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.missed li{font-size:14.5px;margin-bottom:6px;color:var(--ink)}
.missed li span{color:var(--teal)}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
</style>

<div class="wrap">
  <header class="top">
    <a class="home" href="index.html" style="color:var(--amber);border:1px solid var(--line);margin-bottom:14px">← Study page</a>
    <div class="eyebrow">@@EYEBROW@@</div>
    <div class="brand"><h1>@@ARCADE_H1@@</h1></div>
    <svg class="trace" viewBox="0 0 800 56" preserveAspectRatio="none" aria-hidden="true">
      <path class="base" d="M0 40 H800"/>
      <path d="M0 40 H300 L318 40 L330 6 L344 50 L356 44 L380 40 H520 L532 40 L540 22 L550 44 L560 40 H800"/>
    </svg>
    <p class="sub">@@ARCADE_SUB@@ Every round draws different questions, and your best scores stay in this browser.</p>
  </header>
  <main id="app"></main>
  <footer>Card text is paraphrased from the sources cited on the study page. Full references are listed there.</footer>
</div>

<script>
(function(){
/* ================= DATA ================= */
/*@@DATA@@*/
var BL_POOL=BL.map(function(x){return x[1]});

/* ================= HELPERS ================= */
var app=document.getElementById('app'), timers=[];
function clearTimers(){timers.forEach(function(t){clearTimeout(t);clearInterval(t)});timers=[]}
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function h(html){app.innerHTML=html;window.scrollTo(0,0)}
var BEST={};try{BEST=JSON.parse(localStorage.getItem('@@PFX@@-arcade-best')||'{}')||{}}catch(e){BEST={}}
function saveBest(k,v){var isNew=!(k in BEST)||v>BEST[k];if(isNew){BEST[k]=v;try{localStorage.setItem('@@PFX@@-arcade-best',JSON.stringify(BEST))}catch(e){}}return isNew}
function bar(title,hud){return '<div class="bar"><button class="back" id="back" type="button">← Arcade</button><h2>'+title+'</h2><div class="hud">'+hud+'</div></div>'}
function wireBack(){var b=document.getElementById('back');if(b)b.onclick=hub}
function results(key,title,score,max,unit,missed,again){
  try{if(missed&&missed.length){var AK="@@PFX@@"+'-amiss-v1',A=JSON.parse(localStorage.getItem(AK)||'{}')||{};missed.forEach(function(x){var k=String(x[0])+' → '+String(x[1]);var e=A[k]||{n:0};e.n++;e.last=Date.now();e.g=title;A[k]=e});localStorage.setItem(AK,JSON.stringify(A))}localStorage.setItem("@@PFX@@"+'-sync-ts',String(Date.now()))}catch(e){}
  clearTimers();
  var isNew=saveBest(key,score);
  var m='';
  if(missed&&missed.length){m='<div class="missed"><h4>Review these</h4><ul>'+missed.map(function(x){return '<li>'+esc(x[0])+' → <span>'+esc(x[1])+'</span></li>'}).join('')+'</ul></div>'}
  h(bar(title,'')+'<div class="result"><div class="eyebrow">Round complete</div><div class="score">'+score+(max?'<span style="font-size:28px;color:var(--muted)"> / '+max+'</span>':'')+'</div><div>'+unit+'</div><div class="best">'+(isNew?'New best!':'Best: '+BEST[key])+'</div>'+m+'<div class="row"><button class="btn go" id="again" type="button">Play again</button><button class="btn" id="home" type="button">Back to arcade</button></div></div>');
  wireBack();document.getElementById('again').onclick=again;document.getElementById('home').onclick=hub;
  document.getElementById('again').focus();
}

/* ================= HUB ================= */
var GAMES=[
 {id:'match',k:'Connect',t:'Match It',d:'@@GAME_MATCH@@ Tap a left card, then its match.',fn:function(){match()}},
 {id:'sort',k:'Classify',t:'Sort It',d:'@@GAME_SORT@@',fn:function(){sortGame()}},
 {id:'tf',k:'60 seconds',t:'Lightning Round',d:'True or false, as many as you can before the timer runs out. Streaks count.',fn:function(){lightning()}},
 {id:'order',k:'Sequence',t:'Order Up',d:'@@GAME_ORDER@@',fn:function(){order()}},
 {id:'blank',k:'Fill in',t:'Fill the Blank',d:'Key numbers and terms, with four choices each.',fn:function(){blanks()},wide:true}
];
function bestFor(id){var keys=Object.keys(BEST).filter(function(k){return k.indexOf(id)===0});if(!keys.length)return 'Not played yet';var v=Math.max.apply(null,keys.map(function(k){return BEST[k]}));return 'Best: '+v}
function hub(){
  clearTimers();
  var html='<div class="grid">'+GAMES.map(function(g){return '<button class="tile'+(g.wide?' wide':'')+'" type="button" data-g="'+g.id+'"><span class="k">'+g.k+'</span><h3>'+g.t+'</h3><p>'+g.d+'</p><span class="best">'+bestFor(g.id)+'</span></button>'}).join('')+'</div>';
  app.innerHTML=html;
  [].forEach.call(app.querySelectorAll('.tile'),function(b){b.onclick=function(){GAMES.filter(function(g){return g.id===b.getAttribute('data-g')})[0].fn()}});
}

/* ================= MATCH ================= */
var matchDeck=Object.keys(MATCH)[0];
function match(){
  clearTimers();
  var pairs=shuffle(MATCH[matchDeck]).slice(0,6).map(function(p,i){return {id:i,t:p[0],c:p[1]}});
  var left=shuffle(pairs),right=shuffle(pairs),sel=null,done=0,miss=0,missed=[];
  var chips=Object.keys(MATCH).map(function(k){return '<button class="chip'+(k===matchDeck?' on':'')+'" type="button" data-d="'+k+'">'+k+'</button>'}).join('');
  h(bar('Match It','<span class="pill">Pairs <b id="m-d">0</b>/6</span><span class="pill">Misses <b id="m-m">0</b></span>')+
    '<p class="howto">Tap a card on the left, then the description it matches.</p><div class="chips">'+chips+'</div>'+
    '<div class="cols"><div class="col">'+left.map(function(p){return '<button class="card term" type="button" data-id="'+p.id+'">'+esc(p.t)+'</button>'}).join('')+'</div>'+
    '<div class="col">'+right.map(function(p){return '<button class="card" type="button" data-id="'+p.id+'">'+esc(p.c)+'</button>'}).join('')+'</div></div>');
  wireBack();
  [].forEach.call(app.querySelectorAll('.chip'),function(c){c.onclick=function(){matchDeck=c.getAttribute('data-d');match()}});
  var terms=app.querySelectorAll('.col:first-child .card'),clues=app.querySelectorAll('.col:last-child .card');
  [].forEach.call(terms,function(b){b.onclick=function(){if(b.classList.contains('done'))return;[].forEach.call(terms,function(x){x.classList.remove('sel')});b.classList.add('sel');sel=b}});
  [].forEach.call(clues,function(b){b.onclick=function(){
    if(!sel||b.classList.contains('done'))return;
    if(sel.getAttribute('data-id')===b.getAttribute('data-id')){
      sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel.disabled=true;b.disabled=true;sel=null;done++;
      document.getElementById('m-d').textContent=done;
      if(done===6){var score=Math.max(0,60-miss*5);later(function(){results('match-'+matchDeck,'Match It',score,60,'points · '+miss+' miss'+(miss===1?'':'es')+' ('+matchDeck+')',missed,match)},500)}
    }else{
      miss++;document.getElementById('m-m').textContent=miss;
      var p=pairs[+sel.getAttribute('data-id')];if(!missed.some(function(x){return x[0]===p.t}))missed.push([p.t,p.c]);
      b.classList.add('bad');var s=sel;s.classList.add('bad');later(function(){b.classList.remove('bad');s.classList.remove('bad')},350);
    }
  }});
}

/* ================= SORT ================= */
var sortSet=Object.keys(SORT)[0];
function sortGame(){
  clearTimers();
  var set=SORT[sortSet],items=shuffle(set.items).slice(0,10),i=0,score=0,missed=[],locked=false;
  var chips=Object.keys(SORT).map(function(k){return '<button class="chip'+(k===sortSet?' on':'')+'" type="button" data-s="'+k+'">'+k+'</button>'}).join('');
  h(bar('Sort It','<span class="pill">Card <b id="s-i">1</b>/'+items.length+'</span><span class="pill">Score <b id="s-s">0</b></span>')+
    '<div class="chips">'+chips+'</div><div class="stage"><span class="lab">'+esc(sortSet)+'</span><div class="big" id="s-item"></div></div>'+
    '<div class="buckets '+(set.b.length===4?'b4':set.b.length===3?'b3':'b2')+'">'+set.b.map(function(b,j){return '<button class="bucket" type="button" data-j="'+j+'">'+esc(b)+'</button>'}).join('')+'</div><div class="feedback" id="s-fb"></div>');
  wireBack();
  [].forEach.call(app.querySelectorAll('.chip'),function(c){c.onclick=function(){sortSet=c.getAttribute('data-s');sortGame()}});
  var bs=app.querySelectorAll('.bucket');
  function show(){document.getElementById('s-item').textContent=items[i][0];document.getElementById('s-i').textContent=i+1;document.getElementById('s-fb').innerHTML='';[].forEach.call(bs,function(b){b.classList.remove('right','wrong')});locked=false}
  [].forEach.call(bs,function(b){b.onclick=function(){
    if(locked)return;locked=true;
    var j=+b.getAttribute('data-j'),ans=items[i][1],fb=document.getElementById('s-fb');
    bs[ans].classList.add('right');
    if(j===ans){score++;fb.innerHTML='<span class="ok">Correct.</span>'}else{b.classList.add('wrong');missed.push([items[i][0],set.b[ans]]);fb.innerHTML='<span class="no">It’s '+esc(set.b[ans])+'.</span>'}
    document.getElementById('s-s').textContent=score;
    later(function(){i++;if(i>=items.length)results('sort-'+sortSet,'Sort It',score,items.length,'correct ('+sortSet+')',missed,sortGame);else show()},j===ans?650:1500);
  }});
  show();
}

/* ================= LIGHTNING ================= */
function lightning(){
  clearTimers();
  var deck=shuffle(TF),i=0,score=0,streak=0,bestStreak=0,left=60,missed=[],locked=false;
  h(bar('Lightning Round','<span class="pill">Time <b id="l-t">60</b>s</span><span class="pill">Score <b id="l-s">0</b></span><span class="pill">Streak <b id="l-k">0</b></span>')+
    '<div class="timer"><i id="l-bar"></i></div><div class="stage"><span class="lab">True or false?</span><div class="big" id="l-q"></div></div>'+
    '<div class="tf"><button class="t" type="button" id="l-true">True</button><button class="f" type="button" id="l-false">False</button></div><div class="feedback" id="l-fb">Keys: T or F</div>');
  wireBack();
  function show(){if(i>=deck.length){deck=deck.concat(shuffle(TF))}document.getElementById('l-q').textContent=deck[i][0];if(i>0)document.getElementById('l-fb').innerHTML='';locked=false}
  function answer(v){
    if(locked||left<=0)return;locked=true;
    var q=deck[i],ok=(v===q[1]),fb=document.getElementById('l-fb');
    if(ok){score++;streak++;bestStreak=Math.max(bestStreak,streak);fb.innerHTML='<span class="ok">Correct'+(streak>=3?' · '+streak+' in a row':'')+'</span>'}
    else{streak=0;missed.push([q[0],(q[1]?'True':'False')+(q[2]?'. '+q[2]:'')]);fb.innerHTML='<span class="no">'+(q[1]?'True.':'False.')+'</span> '+esc(q[2]||'')}
    document.getElementById('l-s').textContent=score;document.getElementById('l-k').textContent=streak;
    later(function(){i++;show()},ok?250:1200);
  }
  document.getElementById('l-true').onclick=function(){answer(1)};
  document.getElementById('l-false').onclick=function(){answer(0)};
  var key=function(e){if(!document.getElementById('l-true')){document.removeEventListener('keydown',key);return}if(e.key==='t'||e.key==='T')answer(1);if(e.key==='f'||e.key==='F')answer(0)};
  document.addEventListener('keydown',key);
  var iv=setInterval(function(){left--;var t=document.getElementById('l-t');if(!t){clearInterval(iv);return}t.textContent=left;document.getElementById('l-bar').style.width=(left/60*100)+'%';if(left<=0){clearInterval(iv);document.removeEventListener('keydown',key);results('tf','Lightning Round',score,0,'correct in 60 s · best streak '+bestStreak,missed.slice(-8),lightning)}},1000);
  timers.push(iv);
  show();
}

/* ================= ORDER ================= */
function order(){
  clearTimers();
  var rounds=shuffle(SEQ).slice(0,5),r=0,total=0,missed=[];
  function round(){
    var name=rounds[r][0],steps=rounds[r][1],next=0,miss=0,pool=shuffle(steps);
    if(pool.join()===steps.join()&&steps.length>1)pool=pool.slice(1).concat(pool[0]);
    h(bar('Order Up','<span class="pill">Round <b>'+(r+1)+'</b>/5</span><span class="pill">Score <b>'+total+'</b></span>')+
      '<div class="stage" style="min-height:0;padding:18px"><span class="lab">Put in order</span><div class="big">'+esc(name)+'</div></div>'+
      '<div class="slots">'+steps.map(function(_,k){return '<div class="slot" data-k="'+k+'"><span class="n">'+(k+1)+'</span><span></span></div>'}).join('')+'</div>'+
      '<div class="pool">'+pool.map(function(s){return '<button class="seqchip" type="button">'+esc(s)+'</button>'}).join('')+'</div><div class="feedback" id="o-fb">Tap the first step.</div>');
    wireBack();
    var slots=app.querySelectorAll('.slot');
    [].forEach.call(app.querySelectorAll('.seqchip'),function(b){b.onclick=function(){
      if(b.textContent===steps[next]){
        slots[next].classList.add('filled');slots[next].lastChild.textContent=steps[next];b.remove();next++;
        document.getElementById('o-fb').textContent=next<steps.length?'Next step…':'';
        if(next===steps.length){var pts=Math.max(0,10-miss*2);total+=pts;if(miss)missed.push([name,steps.join(' → ')]);
          document.getElementById('o-fb').innerHTML='<span class="ok">+'+pts+' points</span>';
          later(function(){r++;if(r>=rounds.length)results('order','Order Up',total,50,'points across 5 sequences',missed,order);else round()},900)}
      }else{miss++;b.classList.add('bad');later(function(){b.classList.remove('bad')},350);document.getElementById('o-fb').innerHTML='<span class="no">Not that one yet.</span>'}
    }});
  }
  round();
}

/* ================= BLANKS ================= */
function blanks(){
  clearTimers();
  var qs=shuffle(BL).slice(0,10),i=0,score=0,missed=[],locked=false;
  function show(){
    var q=qs[i],opts=shuffle([q[1]].concat(shuffle(BL_POOL.filter(function(w){return w!==q[1]})).slice(0,3)));
    h(bar('Fill the Blank','<span class="pill">Line <b>'+(i+1)+'</b>/10</span><span class="pill">Score <b>'+score+'</b></span>')+
      '<div class="stage"><span class="lab">Fill the blank</span><div class="blank-line" id="b-line">'+esc(q[0]).replace('___','<span class="gap" id="b-gap">?</span>')+'</div></div>'+
      '<div class="buckets b2">'+opts.map(function(o){return '<button class="bucket" type="button">'+esc(o)+'</button>'}).join('')+'</div><div class="feedback" id="b-fb"></div>');
    wireBack();locked=false;
    var bs=app.querySelectorAll('.bucket');
    [].forEach.call(bs,function(b){b.onclick=function(){
      if(locked)return;locked=true;var ok=b.textContent===q[1];
      [].forEach.call(bs,function(x){if(x.textContent===q[1])x.classList.add('right')});
      document.getElementById('b-gap').textContent=q[1];
      if(ok){score++;document.getElementById('b-fb').innerHTML='<span class="ok">Correct.</span>'}
      else{b.classList.add('wrong');missed.push([q[0].replace('___','…'),q[1]]);document.getElementById('b-fb').innerHTML='<span class="no">Answer: '+esc(q[1])+'</span>'}
      later(function(){i++;if(i>=qs.length)results('blank','Fill the Blank',score,10,'lines correct',missed,blanks);else show()},ok?700:1500);
    }});
  }
  show();
}

hub();
})();
</script>

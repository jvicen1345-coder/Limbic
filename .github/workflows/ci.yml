# Runs the checks a contributor already runs locally (README "Local development"), on every
# PR and every push to main. Before this existed nothing ran them automatically, so a change
# could rename a heading the e2e suite asserts on and land green — which is exactly what
# happened to three Movement Lab tests (see the `e2e` job below).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's result irrelevant — don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which writes src/generated/prisma —
      # tsc and eslint both need it, so this has to come before either.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # NOT BLOCKING YET — deliberately. Three tests in e2e/movement-lab.spec.ts assert
    # headings that PRs #376 and #380 renamed ("Home Exercise Programs" -> "Exercise
    # Programs", and the standalone Movement Lab page becoming a tab). They have been
    # failing on main since those landed; this job is what surfaces them. The spec is
    # currently also being edited on claude/legal-risk-review-2d6asg, so fixing it here
    # would collide with that branch (COORDINATION.md rule 4).
    #
    # Once those three assertions match the current UI, delete this line to make the job
    # blocking. Nothing else about the job needs to change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite runs against a real dev server and the local SQLite dev.db, exactly as
      # playwright.config.ts documents — there is no mocked backend. .env.example's
      # DATABASE_URL already points at file:./dev.db; the only value that must not be the
      # placeholder is the session-cookie signing key.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=\"$(openssl rand -base64 32)\"|" .env

      - name: Apply migrations
        run: node scripts/apply-migrations.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's `webServer` starts `npm run dev` itself and waits for :3000.
      # CI=true also turns on forbidOnly and the config's 2 retries.
      - name: Run Playwright
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

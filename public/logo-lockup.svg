<!-- Limbic Logo — full lockup (icon + wordmark + tagline) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 140" width="388" height="140" role="img" aria-label="Limbic — Curated Research">
  <defs>
    <radialGradient id="g" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2F6692"/>
      <stop offset="45%" stop-color="#1D4D75"/>
      <stop offset="75%" stop-color="#12385D"/>
      <stop offset="100%" stop-color="#092744"/>
    </radialGradient>
  </defs>

  <!-- Background — matches the app's card surface color, faded so it reads as a soft
       backdrop rather than a solid card competing with the sign-in card below it. -->
  <rect x="0" y="0" width="388" height="140" rx="18" fill="#DBE7FB" fill-opacity="0.55"/>

  <!-- Icon — same markup as components/icons.tsx's LogoIcon (0-300 viewBox, a nested
       0-600x400 svg embedding the network graph verbatim), scaled 0.2333 (70/300) into
       this lockup's own 70x70 icon slot rather than hand-converted coordinates. -->
  <g transform="translate(22 22) scale(0.233333)">
    <circle cx="150" cy="150" r="148" fill="url(#g)"/>
    <svg x="54" y="86" width="192" height="128" viewBox="0 0 600 400">
      <g stroke="#F5F5F3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M300 70 L120 190 L300 300 L480 190 Z"/>
        <path d="M300 70 L300 300"/>
        <path d="M120 190 L120 330"/>
        <path d="M480 190 L480 330"/>
        <path d="M120 330 L300 230 L480 330"/>
      </g>
      <g fill="#F5F5F3">
        <circle cx="300" cy="70" r="45"/>
        <circle cx="120" cy="190" r="45"/>
        <circle cx="480" cy="190" r="45"/>
        <circle cx="300" cy="230" r="65"/>
        <circle cx="120" cy="330" r="45"/>
        <circle cx="480" cy="330" r="45"/>
      </g>
    </svg>
  </g>

  <!-- Wordmark -->
  <text x="150" y="86"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="56" font-weight="750" fill="#1A5276">Limbic</text>

  <!-- Tagline -->
  <text x="152" y="112"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="12" letter-spacing="3.2" fill="#4B6B80" opacity="0.9">CURATED RESEARCH</text>
</svg>

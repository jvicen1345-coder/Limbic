<!-- Limbic Logo — full lockup (icon + wordmark + tagline) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 140" width="388" height="140" role="img" aria-label="Limbic — Curated Research">
  <defs>
    <radialGradient id="g" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2F6692"/>
      <stop offset="45%" stop-color="#1D4D75"/>
      <stop offset="75%" stop-color="#12385D"/>
      <stop offset="100%" stop-color="#092744"/>
    </radialGradient>
    <!-- Baloo 2 ExtraBold, subset to just the glyphs "Limbic CURATED RESEARCH" actually
         uses (pyftsubset, ~2KB) and embedded as a data: URI rather than linked, since this
         file is loaded via a plain <img src>, a context that generally won't fetch external
         @font-face resources (no network font request, no flash of fallback text, works the
         same everywhere this file is used). -->
    <style>
      @font-face {
        font-family: "Limbic Wordmark";
        font-weight: 800;
        src: url(data:font/woff2;base64,) format("woff2");
      }
    </style>
  </defs>

  <!-- Background — matches the app's card surface color, faded so it reads as a soft
       backdrop rather than a solid card competing with the sign-in card below it. -->
  <rect x="0" y="0" width="388" height="140" rx="18" fill="#DBE7FB" fill-opacity="0.55"/>

  <!-- Icon — same markup as components/icons.tsx's LogoIcon (flat 0-100 viewBox), scaled
       0.7 (70/100) into this lockup's own 70x70 icon slot. -->
  <g transform="translate(22 22) scale(0.7)">
    <circle cx="50" cy="50" r="50" fill="url(#g)"/>
    <g stroke="#F5F5F3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 18 L78 34 L78 68 L50 82 L22 68 L22 34 Z"/>
      <path d="M50 52 L50 18"/>
      <path d="M50 52 L78 34"/>
      <path d="M50 52 L78 68"/>
      <path d="M50 52 L50 82"/>
      <path d="M50 52 L22 68"/>
      <path d="M50 52 L22 34"/>
    </g>
    <g fill="#F5F5F3">
      <circle cx="50" cy="18" r="7"/>
      <circle cx="78" cy="34" r="7"/>
      <circle cx="78" cy="68" r="7"/>
      <circle cx="50" cy="82" r="7"/>
      <circle cx="22" cy="68" r="7"/>
      <circle cx="22" cy="34" r="7"/>
      <circle cx="50" cy="52" r="10"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="150" y="88"
        font-family="Limbic Wordmark, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="52" font-weight="800" letter-spacing="-1" fill="#1A5276">Limbic</text>

  <!-- Tagline -->
  <text x="152" y="112"
        font-family="Limbic Wordmark, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="12" font-weight="800" letter-spacing="3.2" fill="#4B6B80" opacity="0.9">CURATED RESEARCH</text>
</svg>
